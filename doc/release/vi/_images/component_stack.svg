<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 810" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="box-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="node-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#1158c7"/>
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00f2fe"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff0844"/>
    </marker>
  </defs>

  <!-- ===================== Title ===================== -->
  <text x="500" y="32" fill="#f0f6fc" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">COMPONENT STACK &amp; DATA FLOW</text>

  <!-- ===================== HMI chain (left column) ===================== -->
  <!-- Source: TJC touchscreen -->
  <g transform="translate(60, 60)">
    <rect width="200" height="54" rx="6" fill="url(#box-fill)" stroke="#30363d" stroke-width="1.5"/>
    <text x="100" y="22" fill="#8b949e" font-size="10" text-anchor="middle">SOURCE</text>
    <text x="100" y="40" fill="#f0f6fc" font-size="12" font-weight="bold" text-anchor="middle">TJC touchscreen</text>
  </g>
  <!-- Serial1 transport -->
  <line x1="160" y1="114" x2="160" y2="146" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="168" y="134" fill="#58a6ff" font-size="10" font-weight="bold">Serial1</text>

  <!-- Facade: SRV_Hmi -->
  <g transform="translate(60, 146)">
    <rect width="200" height="54" rx="6" fill="url(#box-fill)" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="100" y="22" fill="#58a6ff" font-size="10" text-anchor="middle">FACADE</text>
    <text x="100" y="40" fill="#f0f6fc" font-size="12" font-weight="bold" text-anchor="middle">SRV_Hmi</text>
  </g>
  <text x="270" y="163" fill="#8b949e" font-size="10">SRV_Hmi_Begin/Update</text>
  <text x="270" y="177" fill="#8b949e" font-size="10">(UART + Hmi class)</text>

  <line x1="160" y1="200" x2="160" y2="232" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Hmi -->
  <g transform="translate(60, 232)">
    <rect width="200" height="54" rx="6" fill="url(#box-fill)" stroke="#30363d" stroke-width="1.5"/>
    <text x="100" y="22" fill="#8b949e" font-size="10" text-anchor="middle">SERVICE</text>
    <text x="100" y="40" fill="#f0f6fc" font-size="12" font-weight="bold" text-anchor="middle">Hmi</text>
  </g>
  <text x="270" y="249" fill="#8b949e" font-size="10">parse commands, answer,</text>
  <text x="270" y="263" fill="#8b949e" font-size="10">report configuration</text>

  <line x1="160" y1="286" x2="160" y2="318" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Robot (coordinator, shared) -->
  <g transform="translate(60, 318)">
    <rect width="200" height="54" rx="6" fill="url(#node-highlight)" stroke="#ff0844" stroke-width="2"/>
    <text x="100" y="22" fill="#ffffff" font-size="10" text-anchor="middle">COORDINATOR</text>
    <text x="100" y="40" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Robot</text>
  </g>
  <text x="270" y="335" fill="#8b949e" font-size="10">choose control source, watchdog,</text>
 <text x="270" y="349" fill="#8b949e" font-size="10">own the configuration</text>

  <line x1="160" y1="372" x2="160" y2="404" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Drive -->
  <g transform="translate(60, 404)">
    <rect width="200" height="54" rx="6" fill="url(#box-fill)" stroke="#30363d" stroke-width="1.5"/>
    <text x="100" y="22" fill="#8b949e" font-size="10" text-anchor="middle">CHASSIS</text>
    <text x="100" y="40" fill="#f0f6fc" font-size="12" font-weight="bold" text-anchor="middle">Drive</text>
  </g>
  <text x="270" y="421" fill="#8b949e" font-size="10">chassis mixing, speed scaling,</text>
  <text x="270" y="435" fill="#8b949e" font-size="10">output limits</text>

  <line x1="160" y1="458" x2="160" y2="490" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- MotorBank -->
  <g transform="translate(60, 490)">
    <rect width="200" height="54" rx="6" fill="url(#box-fill)" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="100" y="22" fill="#00f2fe" font-size="10" text-anchor="middle">MOTOR</text>
    <text x="100" y="40" fill="#f0f6fc" font-size="12" font-weight="bold" text-anchor="middle">MotorBank</text>
  </g>
  <text x="270" y="507" fill="#8b949e" font-size="10">M1..M6: run (PWM), brake, stop</text>

  <line x1="160" y1="544" x2="160" y2="576" stroke="#00f2fe" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="168" y="564" fill="#00f2fe" font-size="10" font-weight="bold">I2C 0x41</text>

  <!-- Pca9685 -->
  <g transform="translate(60, 576)">
    <rect width="200" height="54" rx="6" fill="url(#box-fill)" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="100" y="22" fill="#00f2fe" font-size="10" text-anchor="middle">HARDWARE</text>
    <text x="100" y="40" fill="#f0f6fc" font-size="12" font-weight="bold" text-anchor="middle">Pca9685</text>
  </g>
  <text x="270" y="593" fill="#8b949e" font-size="10">I2C PWM chip (0x41)</text>
  <text x="270" y="607" fill="#8b949e" font-size="10">+ TA6586 motor drivers</text>

  <!-- ===================== ESP-NOW chain (right column) ===================== -->
  <!-- Source: ESP-NOW remote -->
  <g transform="translate(640, 60)">
    <rect width="200" height="54" rx="6" fill="url(#box-fill)" stroke="#30363d" stroke-width="1.5"/>
    <text x="100" y="22" fill="#8b949e" font-size="10" text-anchor="middle">SOURCE</text>
    <text x="100" y="40" fill="#f0f6fc" font-size="12" font-weight="bold" text-anchor="middle">ESP-NOW remote</text>
  </g>
  <!-- ESP-NOW transport -->
  <line x1="740" y1="114" x2="740" y2="146" stroke="#00f2fe" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-cyan)"/>
  <text x="748" y="134" fill="#00f2fe" font-size="10" font-weight="bold">ESP-NOW</text>

  <!-- Facade: SRV_EspNow -->
  <g transform="translate(640, 146)">
    <rect width="200" height="54" rx="6" fill="url(#box-fill)" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="100" y="22" fill="#58a6ff" font-size="10" text-anchor="middle">FACADE</text>
    <text x="100" y="40" fill="#f0f6fc" font-size="12" font-weight="bold" text-anchor="middle">SRV_EspNow</text>
  </g>
  <text x="850" y="163" fill="#8b949e" font-size="10">SRV_EspNow_Begin/Update</text>
  <text x="850" y="177" fill="#8b949e" font-size="10">(WiFi + EspNowLink)</text>

  <line x1="740" y1="200" x2="740" y2="232" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- EspNowLink -->
  <g transform="translate(640, 232)">
    <rect width="200" height="54" rx="6" fill="url(#box-fill)" stroke="#30363d" stroke-width="1.5"/>
    <text x="100" y="22" fill="#8b949e" font-size="10" text-anchor="middle">SERVICE</text>
    <text x="100" y="40" fill="#f0f6fc" font-size="12" font-weight="bold" text-anchor="middle">EspNowLink</text>
  </g>
  <text x="850" y="249" fill="#8b949e" font-size="10">validate MAC, length, type</text>
  <text x="850" y="263" fill="#8b949e" font-size="10">and CRC; queue packets</text>

  <line x1="740" y1="286" x2="740" y2="318" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Robot (shared coordinator) -->
  <g transform="translate(640, 318)">
    <rect width="200" height="54" rx="6" fill="url(#node-highlight)" stroke="#ff0844" stroke-width="2"/>
    <text x="100" y="22" fill="#ffffff" font-size="10" text-anchor="middle">COORDINATOR</text>
    <text x="100" y="40" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Robot</text>
  </g>
  <text x="850" y="335" fill="#8b949e" font-size="10">sequence check, source</text>
  <text x="850" y="349" fill="#8b949e" font-size="10">selection and watchdog</text>

  <!-- Merge: both command sources meet in Robot -->
  <path d="M 660 372 L 660 392 L 240 392 L 240 376" fill="none" stroke="#ff0844" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
  <text x="450" y="386" fill="#ff0844" font-size="10" font-weight="bold" text-anchor="middle">both command sources merge in Robot</text>

  <!-- ===================== Side entries (bottom) ===================== -->
  <!-- Servos -->
  <g transform="translate(60, 660)">
    <rect width="200" height="54" rx="6" fill="url(#box-fill)" stroke="#30363d" stroke-width="1.5"/>
    <text x="100" y="22" fill="#8b949e" font-size="10" text-anchor="middle">SOURCE</text>
    <text x="100" y="40" fill="#f0f6fc" font-size="12" font-weight="bold" text-anchor="middle">Servos</text>
  </g>
  <line x1="260" y1="687" x2="330" y2="687" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <g transform="translate(330, 660)">
    <rect width="200" height="54" rx="6" fill="url(#box-fill)" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="100" y="22" fill="#58a6ff" font-size="10" text-anchor="middle">FACADE</text>
    <text x="100" y="40" fill="#f0f6fc" font-size="12" font-weight="bold" text-anchor="middle">CDD_Servo_*</text>
  </g>
  <text x="540" y="677" fill="#8b949e" font-size="10">facade over ServoOut</text>
  <text x="540" y="691" fill="#8b949e" font-size="10">(PCA9685 chip 0x40)</text>

  <!-- Digital / analog pins -->
  <g transform="translate(60, 730)">
    <rect width="200" height="54" rx="6" fill="url(#box-fill)" stroke="#30363d" stroke-width="1.5"/>
    <text x="100" y="22" fill="#8b949e" font-size="10" text-anchor="middle">SOURCE</text>
    <text x="100" y="40" fill="#f0f6fc" font-size="12" font-weight="bold" text-anchor="middle">Digital / analog pins</text>
  </g>
  <line x1="260" y1="757" x2="330" y2="757" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <g transform="translate(330, 730)">
    <rect width="200" height="54" rx="6" fill="url(#box-fill)" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="100" y="22" fill="#58a6ff" font-size="10" text-anchor="middle">FACADE</text>
    <text x="100" y="40" fill="#f0f6fc" font-size="12" font-weight="bold" text-anchor="middle">CDD_Gpio_*</text>
  </g>
  <text x="540" y="747" fill="#8b949e" font-size="10">facade over IoPin: in / out only</text>
</svg>
