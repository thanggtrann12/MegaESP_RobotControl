<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="node-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="node-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#1158c7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <text x="500" y="35" fill="#f0f6fc" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">COMPLETE CONTROL PIPELINE ARCHITECTURE</text>

  <!-- Pipeline Nodes -->
  <!-- 1. Input -->
  <g transform="translate(30, 80)">
    <rect width="100" height="50" rx="6" fill="url(#node-bg)" stroke="#30363d" stroke-width="1.5"/>
    <text x="50" y="24" fill="#8b949e" font-size="10" text-anchor="middle">SOURCE</text>
    <text x="50" y="38" fill="#f0f6fc" font-size="11" font-weight="bold" text-anchor="middle">User Input</text>
  </g>

  <!-- 2. Motion Command -->
  <g transform="translate(160, 80)">
    <rect width="110" height="50" rx="6" fill="url(#node-bg)" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="55" y="22" fill="#58a6ff" font-size="10" text-anchor="middle">DATA STRUCTURE</text>
    <text x="55" y="37" fill="#f0f6fc" font-size="11" font-weight="bold" text-anchor="middle">MotionCommand</text>
  </g>

  <!-- 3. RobotHubController -->
  <g transform="translate(300, 70)">
    <rect width="130" height="70" rx="6" fill="url(#node-highlight)" stroke="#58a6ff" stroke-width="2"/>
    <text x="65" y="28" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold">COORDINATOR</text>
    <text x="65" y="45" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">RobotHubController</text>
  </g>

  <!-- 4. Safety & Config branches (Below Controller) -->
  <g transform="translate(260, 180)">
    <rect width="90" height="40" rx="4" fill="url(#node-bg)" stroke="#ff0844" stroke-width="1"/>
    <text x="45" y="24" fill="#ff0844" font-size="10" font-weight="bold" text-anchor="middle">Safety Check</text>
  </g>
  <g transform="translate(380, 180)">
    <rect width="90" height="40" rx="4" fill="url(#node-bg)" stroke="#30363d" stroke-width="1"/>
    <text x="45" y="24" fill="#8b949e" font-size="10" font-weight="bold" text-anchor="middle">Config Valid</text>
  </g>

  <!-- 5. Kinematics -->
  <g transform="translate(460, 80)">
    <rect width="110" height="50" rx="6" fill="url(#node-bg)" stroke="#30363d" stroke-width="1.5"/>
    <text x="55" y="22" fill="#8b949e" font-size="10" text-anchor="middle">ALGORITHM</text>
    <text x="55" y="38" fill="#f0f6fc" font-size="11" font-weight="bold" text-anchor="middle">Kinematics Engine</text>
  </g>

  <!-- 6. Logical Output -->
  <g transform="translate(600, 80)">
    <rect width="110" height="50" rx="6" fill="url(#node-bg)" stroke="#30363d" stroke-width="1.5"/>
    <text x="55" y="22" fill="#8b949e" font-size="10" text-anchor="middle">ABSTRACT</text>
    <text x="55" y="38" fill="#f0f6fc" font-size="11" font-weight="bold" text-anchor="middle">Logical Velocities</text>
  </g>

  <!-- 7. MotorMapper -->
  <g transform="translate(740, 80)">
    <rect width="100" height="50" rx="6" fill="url(#node-bg)" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="50" y="22" fill="#00f2fe" font-size="10" text-anchor="middle">MAPPING</text>
    <text x="50" y="38" fill="#f0f6fc" font-size="11" font-weight="bold" text-anchor="middle">MotorMapper</text>
  </g>

  <!-- 8. Hardware Driver -->
  <g transform="translate(870, 80)">
    <rect width="100" height="50" rx="6" fill="url(#node-bg)" stroke="#ff0844" stroke-width="1.5"/>
    <text x="50" y="22" fill="#ff0844" font-size="10" text-anchor="middle">PHYSICAL</text>
    <text x="50" y="38" fill="#f0f6fc" font-size="11" font-weight="bold" text-anchor="middle">TA6586 PWM</text>
  </g>

  <!-- Main Pipeline Arrows -->
  <line x1="130" y1="105" x2="160" y2="105" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="270" y1="105" x2="300" y2="105" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="105" x2="460" y2="105" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="105" x2="600" y2="105" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="710" y1="105" x2="740" y2="105" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="840" y1="105" x2="870" y2="105" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Sub-branch lines -->
  <path d="M 345 140 L 345 160 L 305 160 L 305 180" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <path d="M 385 140 L 385 160 L 425 160 L 425 180" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Output Motor -->
  <path d="M 920 130 L 920 250" fill="none" stroke="#ff0844" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="920" cy="270" r="20" fill="#ff0844"/>
  <text x="920" y="275" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">M</text>
</svg>
