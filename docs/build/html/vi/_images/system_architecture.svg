<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="accent-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>
    <linearGradient id="box-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00f2fe"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff0844"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- Outer Container 1: Remote Control Unit -->
  <rect x="20" y="20" width="760" height="260" rx="10" fill="url(#panel-bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="20" y="20" width="760" height="35" rx="10" fill="#1f242c"/>
  <text x="400" y="43" fill="#58a6ff" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1.5">REMOTE CONTROL UNIT (HANDHELD)</text>

  <!-- Joysticks Box -->
  <rect x="40" y="75" width="220" height="85" rx="6" fill="url(#box-fill)" stroke="#30363d" stroke-width="1.5"/>
  <text x="150" y="102" fill="#f0f6fc" font-size="13" font-weight="bold" text-anchor="middle">Dual Joysticks</text>
  <text x="150" y="122" fill="#8b949e" font-size="12" text-anchor="middle">&amp; Toggle Switches</text>

  <!-- Remote Mega Box -->
  <rect x="320" y="75" width="440" height="110" rx="6" fill="url(#box-fill)" stroke="#30363d" stroke-width="1.5"/>
  <text x="540" y="97" fill="#58a6ff" font-size="13" font-weight="bold" text-anchor="middle">Arduino Mega 2560 (Remote Unit)</text>
  <text x="340" y="120" fill="#8b949e" font-size="11">• ADC Sampling &amp; Deadzone Filtering</text>
  <text x="340" y="140" fill="#8b949e" font-size="11">• Button Debouncing &amp; Input Mapping</text>

  <!-- ESP8266 TX Box -->
  <rect x="500" y="215" width="260" height="45" rx="6" fill="url(#box-fill)" stroke="#00f2fe" stroke-width="1.5"/>
  <text x="630" y="242" fill="#00f2fe" font-size="13" font-weight="bold" text-anchor="middle">ESP8266 TX Bridge</text>

  <!-- Connections in Remote Unit -->
  <line x1="260" y1="117" x2="320" y2="117" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="630" y1="185" x2="630" y2="215" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="638" y="203" fill="#8b949e" font-size="10">UART2 ASCII</text>

  <!-- ESP-NOW Link -->
  <line x1="630" y1="280" x2="630" y2="350" stroke="#00f2fe" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-cyan)"/>
  <rect x="550" y="302" width="160" height="26" rx="13" fill="#0d1117" stroke="#00f2fe" stroke-width="1"/>
  <text x="630" y="319" fill="#00f2fe" font-size="11" font-weight="bold" text-anchor="middle">ESP-NOW (2.4 GHz ~2.5ms)</text>

  <!-- Outer Container 2: Robot Master Hub -->
  <rect x="20" y="350" width="760" height="540" rx="10" fill="url(#panel-bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="20" y="350" width="760" height="35" rx="10" fill="#1f242c"/>
  <text x="400" y="373" fill="#ff0844" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1.5">ROBOT MASTER HUB (CHASSIS)</text>

  <!-- Touch UI Box -->
  <rect x="40" y="405" width="220" height="150" rx="6" fill="url(#box-fill)" stroke="#30363d" stroke-width="1.5"/>
  <text x="150" y="427" fill="#f0f6fc" font-size="13" font-weight="bold" text-anchor="middle">TJC / Nextion Touch UI</text>
  <text x="50" y="450" fill="#8b949e" font-size="11">• Dynamic Motor Mapping</text>
  <text x="50" y="470" fill="#8b949e" font-size="11">• Robot Configuration</text>
  <text x="50" y="490" fill="#8b949e" font-size="11">• Real-time I/O Status</text>
  <text x="50" y="510" fill="#8b949e" font-size="11">• Manual Motor Testing</text>
  <text x="50" y="530" fill="#8b949e" font-size="11">• Simulation Mode</text>

  <!-- ESP8266 RX Box -->
  <rect x="500" y="405" width="260" height="80" rx="6" fill="url(#box-fill)" stroke="#00f2fe" stroke-width="1.5"/>
  <text x="630" y="427" fill="#00f2fe" font-size="13" font-weight="bold" text-anchor="middle">ESP8266 RX Bridge</text>
  <text x="515" y="450" fill="#8b949e" font-size="11">• Packet Reception &amp; CRC Check</text>
  <text x="515" y="470" fill="#8b949e" font-size="11">• Watchdog &amp; Sequence Tracker</text>

  <!-- Master Hub Central Box -->
  <rect x="40" y="590" width="720" height="120" rx="6" fill="url(#box-fill)" stroke="#ff0844" stroke-width="2"/>
  <text x="400" y="615" fill="#ff0844" font-size="15" font-weight="bold" text-anchor="middle">ARDUINO MEGA 2560 MASTER HUB</text>
  <text x="60" y="642" fill="#f0f6fc" font-size="12">• HMIService &amp; Command Parser</text>
  <text x="60" y="662" fill="#f0f6fc" font-size="12">• Kinematics Engine (Mecanum/Diff/Omni)</text>
  <text x="410" y="642" fill="#f0f6fc" font-size="12">• RobotHubController (Core Logic)</text>
  <text x="410" y="662" fill="#f0f6fc" font-size="12">• Dynamic MotorMapper &amp; Safety Manager</text>

  <!-- Motor Drivers Box -->
  <rect x="260" y="750" width="280" height="50" rx="6" fill="url(#box-fill)" stroke="#30363d" stroke-width="1.5"/>
  <text x="400" y="780" fill="#f0f6fc" font-size="13" font-weight="bold" text-anchor="middle">6x TA6586 Motor Drivers</text>

  <!-- Motors Box -->
  <rect x="310" y="835" width="180" height="40" rx="20" fill="url(#accent-orange)"/>
  <text x="400" y="860" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">DC MOTORS</text>

  <!-- Internal Connections Chassis -->
  <line x1="260" y1="480" x2="500" y2="480" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/>
  <text x="380" y="472" fill="#8b949e" font-size="10" text-anchor="middle">UART1 ASCII</text>

  <line x1="630" y1="485" x2="630" y2="590" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="638" y="540" fill="#8b949e" font-size="10">UART2 ASCII</text>

  <line x1="150" y1="555" x2="150" y2="590" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <line x1="400" y1="710" x2="400" y2="750" stroke="#ff0844" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="408" y="733" fill="#8b949e" font-size="10">Hardware PWM (12x Pins)</text>

  <line x1="400" y1="800" x2="400" y2="835" stroke="#ff0844" stroke-width="2" marker-end="url(#arrow-orange)"/>
</svg>
