; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Chọn môi trường mặc định muốn Biên dịch / Nạp code
default_envs = remote_mega2560

; Sources were moved directly under legacy/ during the repo restructure.
src_dir = .

; Chỉ định thư mục lưu trữ Thư viện chung
lib_dir = lib

[env]
build_flags =
  -Iinclude

monitor_speed = 115200
monitor_filters =
  direct

; =========================================================================
; 1. Môi trường Tay Cầm (Remote Master): Arduino Mega 2560
; =========================================================================
[env:remote_mega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
upload_port = COM21
monitor_port = COM21

; Tự động tìm và biên dịch các module trong lib/
lib_deps =
build_src_filter =
  +<Remote_Mega2560/*>

; =========================================================================
; 2. Môi trường ESP8266 Bridge Tay Cầm (Gửi ESP-NOW)
; =========================================================================
[env:remote_ESP8266_bridge]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_protocol = espota
upload_port = 192.168.42.55

lib_deps =
build_src_filter =
  +<Remote_ESP8266_Bridge/*>
