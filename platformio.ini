; PlatformIO Project Configuration File
;
;   pio run -e hub                 build
;   pio run -e hub -t upload       flash
;   pio run -e remote_mega2560     build the legacy Mega2560 remote
;   pio run -e remote_mega2560 -t upload
;   pio run -e remote_ESP8266_bridge
;   pio run -e remote_ESP8266_bridge -t upload
;   pio run -e remote_ESP8266_bridge_serial -t upload
;
; Machine-specific settings (COM port, OTA address) go in platformio.local.ini, which is
; git-ignored. Copy platformio.local.ini.example to start.

[platformio]
default_envs = hub

; src_dir is the repo root; build_src_filter below picks exactly what gets compiled.
src_dir = .
extra_configs = platformio.local*.ini

; Shared by every env. Keep board-specific values (upload_speed, monitor_filters) out of here:
; the Mega2560 bootloader only talks at 115200, so a shared 921600 breaks its upload.
[env]
framework = arduino
monitor_speed = 115200

;------------------------------------------------------------------------------------------
; ESP32-S3 hub
;------------------------------------------------------------------------------------------
[env:hub]
platform = espressif32
; For reproducible builds pin the platform, e.g.:  platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
upload_speed = 921600
upload_port = COM13
monitor_port = COM13
monitor_filters = direct, esp32_exception_decoder

; Application + every component's src/. Headers (api/, cfg/<variant>/) are added by
; tools/pio_components.py. utest/, legacy/, doc/ and tools/ are never compiled.
build_src_filter =
    -<*>
    +<app/>
    +<components/*/src/>
extra_scripts =
    pre:tools/pio_components.py
    post:tools/pio_versioned_bin.py

; Folder name under components/*/cfg/ that holds the pins and constants of this board.
custom_hw_variant = s3_devkit

; Arduino framework libraries the components include.
lib_deps =
    Wire
    EEPROM
    WiFi
    WiFiClientSecure
    HTTPClient
    rweather/Crypto

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
; Warnings for our own code only (not the framework).
build_src_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter

;------------------------------------------------------------------------------------------
; Legacy Mega2560 remote
;------------------------------------------------------------------------------------------
[env:remote_mega2560]
platform = atmelavr
board = megaatmega2560
upload_speed = 115200        ; Mega2560 bootloader speed; 921600 makes avrdude time out
upload_port = COM21
monitor_port = COM21
monitor_filters = direct
build_flags =
    -Ilegacy/include
    -Icomponents/SRV_EspNow/api
    -Icomponents/Common/api
    -Icomponents/SRV_Log/api
lib_deps =
lib_extra_dirs = legacy/lib
build_src_filter =
    -<*>
    +<legacy/Remote_Mega2560/*.cpp>
    +<components/SRV_Log/src/*.cpp>

;------------------------------------------------------------------------------------------
; Remote ESP8266 bridge (OTA)
;------------------------------------------------------------------------------------------
[env:remote_ESP8266_bridge]
platform = espressif8266
board = nodemcuv2
upload_protocol = espota
upload_port = 192.168.42.55
build_flags =
    -Ilegacy/include
    -Icomponents/SRV_EspNow/api
    -Icomponents/Common/api
    -Icomponents/SRV_Log/api
lib_deps =
lib_extra_dirs = legacy/lib
build_src_filter =
    -<*>
    +<legacy/Remote_ESP8266_Bridge/*.cpp>
    +<components/SRV_Log/src/*.cpp>

; USB serial flashing for when OTA is unavailable. Select the COM port with --upload-port.
[env:remote_ESP8266_bridge_serial]
platform = espressif8266
board = nodemcuv2
upload_protocol = esptool
build_flags =
    -Ilegacy/include
    -Icomponents/SRV_EspNow/api
    -Icomponents/Common/api
    -Icomponents/SRV_Log/api
lib_deps =
lib_extra_dirs = legacy/lib
build_src_filter =
    -<*>
    +<legacy/Remote_ESP8266_Bridge/*.cpp>
    +<components/SRV_Log/src/*.cpp>