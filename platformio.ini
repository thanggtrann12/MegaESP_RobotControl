; MegaESP_RobotControl - ESP32-S3 hub firmware
;
;   pio run -e hub                 build
;   pio run -e hub -t upload       flash
;   pio run -e hub_debug           build with verbose ESP32 logging and debug symbols
;
; Machine-specific settings (COM port, OTA address) go in platformio.local.ini, which is
; git-ignored. Copy platformio.local.ini.example to start. The old Mega2560 / ESP8266
; environments are in legacy/platformio.ini.

[platformio]
default_envs = hub
; src_dir is the repo root; build_src_filter below picks exactly what gets compiled.
src_dir = .
extra_configs = platformio.local*.ini

[env]
platform = espressif32
; For reproducible builds pin the platform, e.g.:  platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = direct, esp32_exception_decoder

[env:hub]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

; Application + every component's src/. Headers (api/, cfg/<variant>/) are added by
; tools/pio_components.py. utest/, legacy/, doc/ and tools/ are never compiled.
build_src_filter =
    -<*>
    +<app/>
    +<components/*/src/>
extra_scripts = pre:tools/pio_components.py

; Folder name under components/*/cfg/ that holds the pins and constants of this board.
custom_hw_variant = s3_devkit

; Arduino framework libraries the components include.
lib_deps =
    Wire
    EEPROM
    WiFi

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
; Warnings for our own code only (not the framework).
build_src_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter

[env:hub_debug]
extends = env:hub
build_type = debug
build_flags =
    ${env:hub.build_flags}
    -DCORE_DEBUG_LEVEL=4
upload_port = COM13
monitor_port = COM13
upload_speed = 921600